plugins {
    id "fabric-loom"
}

base {
    archivesName = "${archives_base_name}-fabric"
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "SquidDev"
                url = "https://maven.squiddev.cc"
            }
        }
        filter { includeGroup("cc.tweaked") }
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // CC: Tweaked (only its public API is used)
    modCompileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-fabric-api:${cct_version}"
    modRuntimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cct_version}"

    // Crypto, bundled in the jar
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"
    include "org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir("run-server")
        }
    }
}

processResources {
    var props = [
            "version"          : rootProject.mod_version,
            "mod_id"           : rootProject.mod_id,
            "mod_name"         : rootProject.mod_name,
            "minecraft_version": rootProject.minecraft_version,
            "loader_version"   : rootProject.loader_version,
            "cct_version"      : rootProject.cct_version
    ]
    inputs.properties(props)
    filesMatching("fabric.mod.json") {
        expand props
    }
}
