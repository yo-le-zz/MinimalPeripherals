plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'SquidDev'
                url = 'https://maven.squiddev.cc'
            }
        }
        filter { includeGroup('cc.tweaked') }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // CC: Tweaked (only its public API is used)
    modCompileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cct_version}"
    modRuntimeOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric:${project.cct_version}"

    // Crypto, bundled in the jar
    implementation "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
    include "org.bouncycastle:bcprov-jdk18on:${project.bouncycastle_version}"
}

processResources {
    var props = [
            'version'          : project.version,
            'mod_id'           : project.mod_id,
            'mod_name'         : project.mod_name,
            'minecraft_version': project.minecraft_version,
            'loader_version'   : project.loader_version,
            'cct_version'      : project.cct_version
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
