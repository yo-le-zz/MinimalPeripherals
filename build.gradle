plugins {
    id "fabric-loom" version "1.17-SNAPSHOT" apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id "net.neoforged.moddev" version "2.0.141" apply false
}

subprojects {
    apply plugin: "maven-publish"

    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
    group = rootProject.maven_group

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = "UTF-8"
    }

    // Both loaders compile the shared sources of /common directly.
    plugins.withType(JavaPlugin) {
        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }

        sourceSets.main {
            java.srcDir(rootProject.file("common/src/main/java"))
            resources.srcDir(rootProject.file("common/src/main/resources"))
        }

        jar {
            from(rootProject.file("LICENSE.txt")) {
                rename { "${it}_${rootProject.archives_base_name}" }
            }
        }
    }
}
